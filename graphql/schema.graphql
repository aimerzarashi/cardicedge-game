type Subscription {
	"""
	自分が参加している対戦の進み（登録済みのプレイヤーだけ）。つないだ直後に今の版を送り、版が進んだらすぐ、
	変わらなくても数秒ごとに送る（つながっていることの確認も兼ねる）。全員が戦利品を受け取り終えたら、その版を送ってから閉じる
	（対戦が終わっただけでは閉じない。受け取らないまま離れた人がいると閉じない）。
	無い・参加していない対戦は MatchNotFoundError を 1 回送って閉じる。SSE（graphql-sse）でつなぐ
	"""
	matchProgress(
		"""
		対戦の公開用の ID
		"""
		id: UUID!
	): MatchProgressResult!
}
