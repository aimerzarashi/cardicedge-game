"""
type BoardTileCounts {
	"""
	土地の数（属性ごとの数の和）
	"""
	land: Int!
	"""
	拠点の数
	"""
	base: Int!
	"""
	チェックポイントの数
	"""
	checkpoint: Int!
	"""
	火属性の土地の数
	"""
	fire: Int!
	"""
	地属性の土地の数
	"""
	earth: Int!
	"""
	水属性の土地の数
	"""
	water: Int!
	"""
	風属性の土地の数
	"""
	wind: Int!
	"""
	無属性の土地の数
	"""
	neutral: Int!
	"""
	複属性の土地の数
	"""
	multi: Int!
	"""
	転送円の数
	"""
	warp: Int!
	"""
	橋の数
	"""
	bridge: Int!
	"""
	聖堂の数
	"""
	sanctuary: Int!
	"""
	ほこらの数
	"""
	shrine: Int!
	"""
	占い館の数
	"""
	prophecyShop: Int!
	"""
	カード屋の数
	"""
	cardShop: Int!
}
"""
土地の属性。土地は必ずどれか 1 つを持つ（火属性の土地・地属性の土地 等）。拠点・チェックポイントは持たない。
効き方（地形効果・連鎖・属性の変更のコスト等）は対戦の決まりで、ここでは決めない
"""
enum BoardTileElement {
	"""
	火（火属性）
	"""
	FIRE
	"""
	地（地属性）
	"""
	EARTH
	"""
	水（水属性）
	"""
	WATER
	"""
	風（風属性）
	"""
	WIND
	"""
	無（無属性）
	"""
	NEUTRAL
	"""
	複（複属性）。火・地・水・風の 4 色のマークが描かれた特殊な土地。組み合わせは持たない（属性の値の 1 つ）
	"""
	MULTI
}
"""
転送円どうし・橋どうしの対（向きは無い。離れていてよい）
"""
type BoardTilePair {
	"""
	片方の端（座標が小さい側。行 → 列の順に比べる）
	"""
	a: BoardPosition!
	"""
	もう片方の端
	"""
	b: BoardPosition!
}
"""
ボードの一覧の 1 ページ（名前の順）
