"""
プレイヤーのアバター。ほかのプレイヤーにも見える名前を持つ
"""
type Avatar {
	"""
	アバターの公開用の ID
	"""
	id: UUID!
	"""
	名前（前後の空白を除いた値。同じプレイヤーの中では一意（全角・半角、大文字・小文字の違いを同じとみなして比べる）。ほかのプレイヤーとは同じ名前でよい）
	"""
	name: String!
}
"""
プレイヤーが持てるアバターの数の上限に達している（操作は行われていない）
"""
type AvatarLimitReachedError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
	"""
	上限の数（画面が「N 体まで」と出せるよう、game は上限の値を書き写さずここから受け取る。値は game_rules の player.max_avatars）
	"""
	max: Int!
}
"""
同じプレイヤーの別のアバターが同じ名前を使っている（操作は行われていない）。ほかのプレイヤーとは同じ名前でよい
"""
type AvatarNameAlreadyInUseError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
拠点
"""
type BaseTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
ボード（公開中のもの）
"""
type Board {
	"""
	公開用の ID
	"""
	id: UUID!
	"""
	名前
	"""
	name: String!
	"""
	幅（列の数）
	"""
	width: Int!
	"""
	高さ（行の数）
	"""
	height: Int!
	"""
	置いてあるマス（置いていない座標は含まない。行 → 列の順: y の小さい順、同じ y では x の小さい順）
	"""
	tiles: [BoardTile!]!
	"""
	マスどうしのつながり（向きは無い。a の座標が小さい側になり、a → b の順に並べる）
	"""
	connections: [BoardConnection!]!
}
"""
マスどうしのつながり（向きは無い）
"""
type BoardConnection {
	"""
	片方の端（座標が小さい側。行 → 列の順に比べる）
	"""
	a: BoardPosition!
	"""
	もう片方の端
	"""
	b: BoardPosition!
}
"""
公開中のボードが無い（公開中でないものを含む）
"""
type BoardNotFoundError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
格子の座標。x が列、y が行（どちらも 0 始まり）
"""
type BoardPosition {
	"""
	列（0 以上、幅 − 1 以下）
	"""
	x: Int!
	"""
	行（0 以上、高さ − 1 以下）
	"""
	y: Int!
}
"""
ボードの詳細の結果。ログイン中のプレイヤーが未登録なら PlayerNotRegisteredError
"""
union BoardResult = Board | BoardNotFoundError | PlayerNotRegisteredError
"""
置いてあるマス（LandTile・BaseTile・CheckpointTile）。種類は __typename で見分け、種類ごとの項目は断片（... on LandTile 等）で取る
"""
interface BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
土地の属性。土地は必ずどれか 1 つを持つ（火属性の土地・地属性の土地 等）。拠点・チェックポイントは持たない。
効き方（地形効果・連鎖・属性の変更のコスト等）は対戦の決まりで、ここでは決めない
"""
enum BoardTileAttribute {
	"""
	火（火属性）
	"""
	FIRE
	"""
	地（地属性）
	"""
	EARTH
	"""
	水（水属性）
	"""
	WATER
	"""
	風（風属性）
	"""
	WIND
	"""
	無（無属性）
	"""
	NEUTRAL
	"""
	複（複属性）。火・地・水・風の 4 色のマークが描かれた特殊な土地。組み合わせは持たない（属性の値の 1 つ）
	"""
	MULTI
}
"""
ボードの一覧の 1 ページ（名前の順）
"""
type BoardsConnection {
	"""
	このページのボード
	"""
	edges: [BoardsEdge!]!
	"""
	ページの情報
	"""
	pageInfo: PageInfo!
}
"""
ボードの一覧の 1 件と、その位置
"""
type BoardsEdge {
	"""
	この 1 件の位置（次のページを取るときに after に渡す）
	"""
	cursor: String!
	"""
	ボード
	"""
	node: Board!
}
"""
ボードの一覧の結果。ログイン中のプレイヤーが未登録なら PlayerNotRegisteredError
"""
union BoardsResult = BoardsConnection | ValidationErrors | PlayerNotRegisteredError
"""
チェックポイント
"""
type CheckpointTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
入力の項目ごとの誤り。理由は __typename で見分ける
"""
interface FieldError {
	"""
	誤りのある入力の項目（GraphQL の引数・入力の項目名と同じ。入れ子の入力は filter.nameContains、一覧の中は cards.0.cardId のように . でつなぐ）
	"""
	field: String!
}
"""
入力の形が正しくない（ページの位置（カーソル）が読めない等）
"""
type FieldInvalidFormat implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
}
"""
入力が範囲の外
"""
type FieldOutOfRange implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	範囲の下限（この値を含む）
	"""
	min: Int!
	"""
	範囲の上限（この値を含む）
	"""
	max: Int!
}
"""
入力が空（前後の空白だけの場合を含む）
"""
type FieldRequired implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
}
"""
入力が長すぎる
"""
type FieldTooLong implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	上限の文字数
	"""
	max: Int!
}
"""
土地（ふつうのマス）
"""
type LandTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
	"""
	属性
	"""
	attribute: BoardTileAttribute!
}
"""
me の結果。登録済みなら Player、未登録なら PlayerNotRegisteredError
"""
union MeResult = Player | PlayerNotRegisteredError
type Mutation {
	"""
	ログイン中のプレイヤーのアバターを作る。上限の数は AvatarLimitReachedError の max で返す
	"""
	registerAvatar(input: RegisterAvatarInput!): RegisterAvatarResult!
	"""
	JWT の (iss, sub) のプレイヤーを登録する。何度呼んでも、プレイヤーは 1 人だけで、登録済みでも同じ形（同じ id）で返す。game は me が PlayerNotRegisteredError のときに呼ぶ
	"""
	registerPlayer: RegisterPlayerResult!
}
"""
ページの情報
"""
type PageInfo {
	"""
	次のページがあるか
	"""
	hasNextPage: Boolean!
	"""
	前のページがあるか（after を指定したら true）
	"""
	hasPreviousPage: Boolean!
	"""
	このページの最初の 1 件の位置
	"""
	startCursor: String
	"""
	このページの最後の 1 件の位置（次のページは after にこれを渡す）
	"""
	endCursor: String
}
"""
プレイヤー。JWT の (iss, sub) に 1 人だけ紐づく
"""
type Player {
	"""
	プレイヤーの公開用の ID
	"""
	id: UUID!
	"""
	スターターの配布の状態。行がまだ無い・配布が始まっていないときも IN_PROGRESS で、画面にとっては「まだ届いていない」と同じ
	"""
	starterGrant: StarterGrantStatus!
	"""
	このプレイヤーのアバター（作った順。上限があるので、ページ分けしないリスト）
	"""
	avatars: [Avatar!]!
}
"""
JWT の (iss, sub) のプレイヤーが、まだ登録されていない。game は registerPlayer を呼んでから、me を呼び直す
"""
type PlayerNotRegisteredError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
type Query {
	"""
	公開中のボードの一覧（登録済みのプレイヤーだけ）
	"""
	boards(
		"""
		1 ページの件数（1〜100。指定が無ければ 50）
		"""
		first: Int

		"""
		前のページの pageInfo.endCursor（指定が無ければ最初のページ）
		"""
		after: String
	): BoardsResult!
	"""
	公開中のボードの詳細（登録済みのプレイヤーだけ）。公開中でなければ BoardNotFoundError
	"""
	board(
		"""
		ボードの公開用の ID
		"""
		id: UUID!
	): BoardResult!
	"""
	ログイン中のプレイヤー（JWT の (iss, sub) に登録済みのプレイヤー）を返す。未登録なら PlayerNotRegisteredError
	"""
	me: MeResult!
}
"""
アバターを作る入力
"""
input RegisterAvatarInput {
	"""
	名前（前後の空白を除いて 1 文字以上。長さの上限は ValidationErrors の FieldTooLong の max で返す）
	"""
	name: String!
}
"""
registerAvatar の結果。ログイン中のプレイヤーが未登録なら PlayerNotRegisteredError
"""
union RegisterAvatarResult = RegisterAvatarSuccess | ValidationErrors | AvatarNameAlreadyInUseError | AvatarLimitReachedError | PlayerNotRegisteredError
"""
アバターを作った
"""
type RegisterAvatarSuccess {
	"""
	作ったアバター
	"""
	avatar: Avatar!
}
"""
registerPlayer の結果
"""
union RegisterPlayerResult = RegisterPlayerSuccess
"""
プレイヤーを登録した（登録済みだったときも同じ形で、そのプレイヤーを返す）
"""
type RegisterPlayerSuccess {
	"""
	登録したプレイヤー。すでに登録済みなら、そのプレイヤー（新しく作らない）
	"""
	player: Player!
}
"""
スターターの配布の状態
"""
enum StarterGrantStatus {
	"""
	まだ届いていない（登録の直後で配布が始まっていない・配っている途中を含む）
	"""
	IN_PROGRESS
	"""
	所持カードとデッキがそろった
	"""
	COMPLETED
}
"""
公開用の ID（UUID の文字列）。core の内部の ID は返さない
"""
scalar UUID
"""
入力の誤り（操作は行われていない）
"""
type ValidationErrors {
	"""
	項目ごとの誤り（1 件以上）
	"""
	errors: [FieldError!]!
}
