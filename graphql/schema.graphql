"""
プレイヤーのアバター。ほかのプレイヤーにも見える名前を持つ
"""
type Avatar {
	"""
	アバターの公開用の ID
	"""
	id: UUID!
	"""
	名前（前後の空白を除いた値。同じプレイヤーの中では一意（全角・半角、大文字・小文字の違いを同じとみなして比べる）。ほかのプレイヤーとは同じ名前でよい）
	"""
	name: String!
}
"""
プレイヤーが持てるアバターの数の上限に達している（操作は行われていない）
"""
type AvatarLimitReachedError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
	"""
	上限の数（画面が「N 体まで」と出せるよう、game は上限の値を書き写さずここから受け取る。値は game_rules の player.max_avatars）
	"""
	max: Int!
}
"""
同じプレイヤーの別のアバターが同じ名前を使っている（操作は行われていない）。ほかのプレイヤーとは同じ名前でよい
"""
type AvatarNameAlreadyInUseError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
拠点
"""
type BaseTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
ボード（公開中のもの）
"""
type Board {
	"""
	公開用の ID
	"""
	id: UUID!
	"""
	名前
	"""
	name: String!
	"""
	幅（列の数）
	"""
	width: Int!
	"""
	高さ（行の数）
	"""
	height: Int!
	"""
	既定のルール（対戦を始めるときの既定の値。始めるときにここから変えられる前提）
	"""
	defaultRules: BoardDefaultRules!
	"""
	マスの数（種類ごと・土地の属性ごと。置いてあるマスから数えた値）
	"""
	tileCounts: BoardTileCounts!
	"""
	置いてあるマス（置いていない座標は含まない。行 → 列の順: y の小さい順、同じ y では x の小さい順）
	"""
	tiles: [BoardTile!]!
	"""
	マスどうしのつながり（向きは無い。a の座標が小さい側になり、a → b の順に並べる）
	"""
	connections: [BoardConnection!]!
	"""
	転送円どうし・橋どうしの対（向きは無い。a の座標が小さい側になり、a → b の順に並べる）。公開中のボードのすべての転送円・橋に対の相手がいる
	"""
	pairs: [BoardTilePair!]!
}
"""
マスどうしのつながり（向きは無い）
"""
type BoardConnection {
	"""
	片方の端（座標が小さい側。行 → 列の順に比べる）
	"""
	a: BoardPosition!
	"""
	もう片方の端
	"""
	b: BoardPosition!
}
"""
ボードの既定のルール。対戦を始めるときはこの値から変えられる前提の、既定の値。
効き方は対戦の決まりで、ここでは値の形だけを決める
"""
type BoardDefaultRules {
	"""
	目標の魔力（魔力がこの値に届いて拠点に戻ると勝ち）
	"""
	targetMagic: Int!
	"""
	開始時の魔力（対戦を始めるときの魔力）
	"""
	startingMagic: Int!
	"""
	周回のボーナス（拠点に戻ったときに増える魔力）
	"""
	lapBonus: Int!
	"""
	チェックポイントのボーナス（チェックポイントを通ったときに増える魔力）
	"""
	checkpointBonus: Int!
	"""
	ラウンドの上限（上限に達したら、その時点で魔力の多い人が勝つ）
	"""
	roundLimit: Int!
	"""
	サイコロの目の最小
	"""
	diceMin: Int!
	"""
	サイコロの目の最大
	"""
	diceMax: Int!
}
"""
公開中のボードが無い（公開中でないものを含む）
"""
type BoardNotFoundError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
格子の座標。x が列、y が行（どちらも 0 始まり）
"""
type BoardPosition {
	"""
	列（0 以上、幅 − 1 以下）
	"""
	x: Int!
	"""
	行（0 以上、高さ − 1 以下）
	"""
	y: Int!
}
"""
ボードの詳細の結果。ログイン中のプレイヤーが未登録なら PlayerNotRegisteredError
"""
union BoardResult = Board | BoardNotFoundError | PlayerNotRegisteredError
"""
置いてあるマス（LandTile・BaseTile・CheckpointTile・WarpTile・BridgeTile・SanctuaryTile・ShrineTile・ProphecyShopTile・CardShopTile）。種類は __typename で見分け、種類ごとの項目は断片（... on LandTile 等）で取る
"""
interface BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
土地の属性。土地は必ずどれか 1 つを持つ（火属性の土地・地属性の土地 等）。拠点・チェックポイントは持たない。
効き方（地形効果・連鎖・属性の変更のコスト等）は対戦の決まりで、ここでは決めない
"""
enum BoardTileAttribute {
	"""
	火（火属性）
	"""
	FIRE
	"""
	地（地属性）
	"""
	EARTH
	"""
	水（水属性）
	"""
	WATER
	"""
	風（風属性）
	"""
	WIND
	"""
	無（無属性）
	"""
	NEUTRAL
	"""
	複（複属性）。火・地・水・風の 4 色のマークが描かれた特殊な土地。組み合わせは持たない（属性の値の 1 つ）
	"""
	MULTI
}
"""
ボードのマスの数（read model の投影のときに数える）。土地だけが属性を持つので、属性ごとの数の和が土地の数になる
"""
type BoardTileCounts {
	"""
	土地の数（属性ごとの数の和）
	"""
	land: Int!
	"""
	拠点の数
	"""
	base: Int!
	"""
	チェックポイントの数
	"""
	checkpoint: Int!
	"""
	火属性の土地の数
	"""
	fire: Int!
	"""
	地属性の土地の数
	"""
	earth: Int!
	"""
	水属性の土地の数
	"""
	water: Int!
	"""
	風属性の土地の数
	"""
	wind: Int!
	"""
	無属性の土地の数
	"""
	neutral: Int!
	"""
	複属性の土地の数
	"""
	multi: Int!
	"""
	転送円の数
	"""
	warp: Int!
	"""
	橋の数
	"""
	bridge: Int!
	"""
	聖堂の数
	"""
	sanctuary: Int!
	"""
	ほこらの数
	"""
	shrine: Int!
	"""
	占い館の数
	"""
	prophecyShop: Int!
	"""
	カード屋の数
	"""
	cardShop: Int!
}
"""
転送円どうし・橋どうしの対（向きは無い。離れていてよい）
"""
type BoardTilePair {
	"""
	片方の端（座標が小さい側。行 → 列の順に比べる）
	"""
	a: BoardPosition!
	"""
	もう片方の端
	"""
	b: BoardPosition!
}
"""
ボードの一覧の 1 ページ（名前の順）
"""
type BoardsConnection {
	"""
	このページのボード
	"""
	edges: [BoardsEdge!]!
	"""
	ページの情報
	"""
	pageInfo: PageInfo!
}
"""
ボードの一覧の 1 件と、その位置
"""
type BoardsEdge {
	"""
	この 1 件の位置（次のページを取るときに after に渡す）
	"""
	cursor: String!
	"""
	ボード
	"""
	node: Board!
}
"""
ボードの一覧の結果。ログイン中のプレイヤーが未登録なら PlayerNotRegisteredError
"""
union BoardsResult = BoardsConnection | ValidationErrors | PlayerNotRegisteredError
"""
橋（通ると、歩数を使わずに対の相手の橋から出る。2 つで 1 マスの両端で、止まるのは入った方と反対側の端）。属性は持たない
"""
type BridgeTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
カード屋（止まると、用意されたカードから 1 枚買える）。属性は持たない
"""
type CardShopTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
カードの種類
"""
enum CardType {
	CREATURE
	ITEM
	SPELL
}
"""
対戦ルールを決める入力。7 つの値の名前と決まりは、ボードの既定のルールと同じ
"""
input ChangeRoomMatchRulesInput {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていた部屋の revision
	"""
	revision: Int!
	"""
	ボードの公開用の ID（作った人が解放した公開中のもの。Player.boards に出るもの）
	"""
	boardId: UUID!
	"""
	目標の魔力（1 以上、開始時の魔力より大きい）
	"""
	targetMagic: Int!
	"""
	開始時の魔力（0 以上）
	"""
	startingMagic: Int!
	"""
	周回のボーナス（0 以上）
	"""
	lapBonus: Int!
	"""
	チェックポイントのボーナス（0 以上）
	"""
	checkpointBonus: Int!
	"""
	ラウンドの上限（1 以上）
	"""
	roundLimit: Int!
	"""
	サイコロの目の最小（1 以上）
	"""
	diceMin: Int!
	"""
	サイコロの目の最大（最小以上）
	"""
	diceMax: Int!
}
"""
changeRoomMatchRules の結果（公開前、または公開前に決めていなければ準備中。決めるのは作った人）。
入力の誤りは ValidationErrors（段階ごと。7 つの値は targetMagic 等の項目名、ボードが選べなければ boardId の FieldNotFound）
"""
union ChangeRoomMatchRulesResult = ChangeRoomMatchRulesSuccess | ValidationErrors | RoomNotFoundError | RevisionConflictError | RoomStatusNotAllowedError | RoomConditionLockedError | RoomNotResponsibleError | RoomAlreadyReadyError | PlayerNotRegisteredError
"""
対戦ルールを決めた（同じ値なら何も変えず、revision も進まない）
"""
type ChangeRoomMatchRulesSuccess {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	変えた部屋の revision
	"""
	revision: Int!
}
"""
席のアバターとデッキを選ぶ入力。席の種類で、選ぶものが変わる
"""
input ChangeRoomSeatChoiceInput {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていた部屋の revision
	"""
	revision: Int!
	"""
	席の番号（席の並びの何番目か。0 始まり）
	"""
	seat: Int!
	"""
	アバターの公開用の ID（プレイヤーの席は座っている人のアバター（Player.avatars に出るもの）、NPC の席は作った人が解放した公開中の NPC のアバター（Player.npcAvatars に出るもの））
	"""
	avatarId: UUID!
	"""
	デッキの公開用の ID（プレイヤーの席は座っている人のデッキ（Player.decks に出るもの）、NPC の席は選んだ NPC のアバターに割り当てた公開中のデッキ（Player.npcAvatars の decks に出るもの））
	"""
	deckId: UUID!
}
"""
changeRoomSeatChoice の結果（公開前、または公開前に決めていなければ準備中）。選んだ時の 1 回だけ、選べるものかを確かめる（準備完了の時には確かめ直さない）。
入力の誤りは ValidationErrors（段階ごと。席が範囲の外なら seat の FieldOutOfRange、次に avatarId・deckId の FieldNotFound。NPC の席は、アバターが選べるときだけデッキを確かめる）
"""
union ChangeRoomSeatChoiceResult = ChangeRoomSeatChoiceSuccess | ValidationErrors | RoomNotFoundError | RevisionConflictError | RoomStatusNotAllowedError | RoomSeatsNotDecidedError | RoomConditionLockedError | RoomNotResponsibleError | RoomAlreadyReadyError | PlayerNotRegisteredError
"""
席のアバターとデッキを選んだ（同じ選択なら何も変えず、revision も進まない）
"""
type ChangeRoomSeatChoiceSuccess {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	変えた部屋の revision
	"""
	revision: Int!
}
"""
席の並びを決める入力
"""
input ChangeRoomSeatsInput {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていた部屋の revision
	"""
	revision: Int!
	"""
	席の並び（席の数は全体のルールの人数の範囲 FieldOutOfRange の min・max、プレイヤーの席は 1 つ FieldCountMismatch の expected）。並びを変えたら、席の選択はすべて外れる
	"""
	seats: [RoomSeatKind!]!
}
"""
changeRoomSeats の結果（公開前だけ。作った人だけ）
"""
union ChangeRoomSeatsResult = ChangeRoomSeatsSuccess | ValidationErrors | RoomNotFoundError | RevisionConflictError | RoomStatusNotAllowedError | RoomNotResponsibleError | PlayerNotRegisteredError
"""
席の並びを決めた（同じ並びなら何も変えず、revision も進まない）
"""
type ChangeRoomSeatsSuccess {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	変えた部屋の revision
	"""
	revision: Int!
}
"""
チェックポイント
"""
type CheckpointTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
部屋を閉じる入力
"""
input CloseRoomInput {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていた部屋の revision
	"""
	revision: Int!
}
"""
closeRoom の結果（作った人だけ。対戦中は閉じられないので RoomStatusNotAllowedError。対戦が終わった後の部屋の動きは先の候補）
"""
union CloseRoomResult = CloseRoomSuccess | RoomNotFoundError | RevisionConflictError | RoomStatusNotAllowedError | RoomNotResponsibleError | PlayerNotRegisteredError
"""
部屋を閉じた（閉じた部屋をもう一度閉じても、何も変えず成功する）
"""
type CloseRoomSuccess {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	閉じた部屋の revision
	"""
	revision: Int!
}
"""
部屋を作る入力
"""
input CreateRoomInput {
	"""
	部屋の名前（前後の空白を除いて 1〜20 文字。FieldRequired・FieldTooLong の max。ほかの部屋と同じでもよい）
	"""
	name: String!
}
"""
createRoom の結果。名前の誤りは ValidationErrors（項目名 name）。ログイン中のプレイヤーが未登録なら PlayerNotRegisteredError
"""
union CreateRoomResult = CreateRoomSuccess | ValidationErrors | PlayerNotRegisteredError
"""
部屋を作った（公開前。席は 0）
"""
type CreateRoomSuccess {
	"""
	作った部屋の公開用の ID
	"""
	id: UUID!
	"""
	作った部屋の revision
	"""
	revision: Int!
}
"""
プレイヤーのデッキ。持ち主のプレイヤーだけが読む（ほかのプレイヤーのデッキは、me.decks にも deck(id) にも出ない）
"""
type Deck {
	"""
	デッキの公開用の ID
	"""
	id: UUID!
	"""
	名前
	"""
	name: String!
	"""
	入っているカードと枚数（種類 → 名前の順。種類は Creature → Item → Spell）。枚数が 0 のカードは含まない
	"""
	cards: [DeckCard!]!
	"""
	カードの枚数の合計
	"""
	totalCount: Int!
	"""
	カードの種類ごとの枚数の合計（種類の数ではなく、枚数の和。入っていない種類は 0）
	"""
	typeCounts: DeckTypeCounts!
}
"""
デッキに入っているカードと、その枚数
"""
type DeckCard {
	"""
	カード
	"""
	card: DeckCardInfo!
	"""
	枚数
	"""
	count: Int!
}
"""
デッキに入っているカードの、見せるのに要る項目
"""
type DeckCardInfo {
	"""
	公開用の ID
	"""
	id: UUID!
	"""
	名前
	"""
	name: String!
	"""
	種類
	"""
	type: CardType!
}
"""
自分のものとしてデッキが無い（無い・ほかのプレイヤーのもの。存在を明かさないため区別しない）
"""
type DeckNotFoundError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
デッキの詳細の結果。ログイン中のプレイヤーが未登録なら PlayerNotRegisteredError
"""
union DeckResult = Deck | DeckNotFoundError | PlayerNotRegisteredError
"""
デッキに入っているカードの、種類ごとの枚数の合計（デッキの read model から返すときに数える）
"""
type DeckTypeCounts {
	"""
	Creature の枚数
	"""
	creature: Int!
	"""
	Item の枚数
	"""
	item: Int!
	"""
	Spell の枚数
	"""
	spell: Int!
}
"""
準備完了を申告する入力
"""
input DeclareRoomReadyInput {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていた部屋の revision
	"""
	revision: Int!
}
"""
declareRoomReady の結果（準備中だけ。自分の担当の分がすべて決まっているときだけ）
"""
union DeclareRoomReadyResult = DeclareRoomReadySuccess | RoomNotFoundError | RevisionConflictError | RoomStatusNotAllowedError | RoomConditionsNotDecidedError | RoomAlreadyReadyError | RoomNotResponsibleError | PlayerNotRegisteredError
"""
準備完了を申告した（以後、自分の担当の分を選び直せない。取り消す操作は無い）
"""
type DeclareRoomReadySuccess {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	申告した部屋の revision
	"""
	revision: Int!
}
"""
入力の一覧の個数が、決まりの個数と違う（例: 部屋のプレイヤーの席の数）
"""
type FieldCountMismatch implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	決まりの個数
	"""
	expected: Int!
}
"""
入力の項目ごとの誤り。理由は __typename で見分ける
"""
interface FieldError {
	"""
	誤りのある入力の項目（GraphQL の引数・入力の項目名と同じ。入れ子の入力は filter.nameContains、一覧の中は cards.0.cardId のように . でつなぐ）
	"""
	field: String!
}
"""
入力の形が正しくない（ページの位置（カーソル）が読めない等）
"""
type FieldInvalidFormat implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
}
"""
入力の ID が指すものが、選べるものの中に無い（無い・ほかのプレイヤーのもの・解放していない・公開中でない等。区別しない）
"""
type FieldNotFound implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
}
"""
入力が、別の入力の項目の値より大きくない（等しいのも含む。例: 目標の魔力が開始時の魔力以下、サイコロの目の最大が最小以下）
"""
type FieldNotGreaterThan implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	大きくなければならない相手の入力の項目（例: startingMagic）
	"""
	than: String!
}
"""
入力が範囲の外
"""
type FieldOutOfRange implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	範囲の下限（この値を含む）
	"""
	min: Int!
	"""
	範囲の上限（この値を含む）
	"""
	max: Int!
}
"""
入力が空（前後の空白だけの場合を含む）
"""
type FieldRequired implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
}
"""
入力が長すぎる
"""
type FieldTooLong implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	上限の文字数
	"""
	max: Int!
}
"""
入力が下限より小さい（上限は無い）
"""
type FieldTooSmall implements FieldError {
	"""
	誤りのある入力の項目
	"""
	field: String!
	"""
	下限（この値を含む）
	"""
	min: Int!
}
"""
ゲーム全体のルール
"""
type GameRules {
	"""
	対戦の決まり
	"""
	match: MatchRules!
}
"""
ゲーム全体のルールの結果。ログイン中のプレイヤーが未登録なら PlayerNotRegisteredError
"""
union GameRulesResult = GameRules | PlayerNotRegisteredError
"""
土地（ふつうのマス）
"""
type LandTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
	"""
	属性
	"""
	attribute: BoardTileAttribute!
}
"""
対戦。参加者は部屋の席の順で返す。
順番は turnOrder（参加者ごと）と turnOrderRolls（決めたサイコロ）で見せる
"""
type Match {
	"""
	対戦の公開用の ID
	"""
