	PREPARING
	"""
	対戦中（全員が準備完了を申告して、対戦が始まった）。対戦は Room.match
	"""
	PLAYING
	"""
	次を決める（対戦が終わり、全員が戦利品を受け取り終えた後）。参加している人が declareRoomNext で続けるか終えるかを選ぶ。誰かが終えるなら休止中、全員が続けるなら準備中に戻る
	"""
	DECIDING_NEXT
	"""
	休止中（対戦の後に誰かが終えた。今日はここまで）。一覧に残り、作った人が resumeRoom で再開すると準備中に戻る
	"""
	PAUSED
	"""
	閉じた（作った人が閉じた）。一覧には出ない
	"""
	CLOSED
}
"""
今の状態ではできない操作（席の並びと公開は公開前だけ、条件を選ぶのは公開前か準備中だけ、準備完了は準備中だけ。操作は行われていない）
"""
type RoomStatusNotAllowedError {
	"""
	開発者向けの説明（画面にそのまま出す文言ではない）
	"""
	message: String!
}
"""
自分の部屋の一覧の 1 ページ（新しい順。閉じた部屋は含まない）
"""
type RoomsConnection {
	"""
	このページの部屋
	"""
	edges: [RoomsEdge!]!
	"""
	ページの情報
	"""
	pageInfo: PageInfo!
}
"""
自分の部屋の一覧の 1 件と、その位置
"""
type RoomsEdge {
	"""
	この 1 件の位置（次のページを取るときに after に渡す）
	"""
	cursor: String!
	"""
	部屋
	"""
	node: Room!
}
"""
聖堂（通る・止まると、属性ごとの品物を売り買いできる）。属性は持たない
"""
type SanctuaryTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
ほこら（止まると、ランダムで特別なことが起きる）。属性は持たない
"""
type ShrineTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
"""
スペル
"""
type SpellCardInfo implements CardInfo {
	"""
	公開用の ID
	"""
	id: UUID!
	"""
	名前
	"""
	name: String!
	"""
	使うのに払う魔力
	"""
	cost: Int!
	"""
	希少度
	"""
	rarity: CardRarity!
	"""
	効果（効果が無ければ null。効果の無いスペルは、対戦で使えない）
	"""
	effect: SpellEffect
}
"""
対象のクリーチャーにダメージ（今の HP から amount を引き、0 になれば破壊する）
"""
type SpellDamageEffect {
	"""
	ダメージ（1 以上）
	"""
	amount: Int!
}
"""
カードを引く効果（山札の先頭から引く。山札が空なら捨て札を混ぜてから）
"""
type SpellDrawCardsEffect {
	"""
	引く枚数（1 以上）
	"""
	count: Int!
}
"""
スペルの効果（種類は __typename で見分ける）
"""
union SpellEffect = SpellDrawCardsEffect | SpellGainMagicEffect | SpellRollDiceEffect | SpellFixedDiceCurseEffect | SpellDamageEffect
"""
次のサイコロの目を決める呪い（対象のプレイヤーが次に振ると、目は value になる。turns ターンで解ける）
"""
type SpellFixedDiceCurseEffect {
	"""
	決める目（1 以上）
	"""
	value: Int!
	"""
	解けるまでのターン数（1 以上。かけられた人が自分のターンを終えるたびに 1 減り、0 で解ける）
	"""
	turns: Int!
}
"""
魔力を得る効果（使った人が（周回数 + 1）× perLap の魔力を得る。周回数はその対戦で周回を終えた回数）
"""
type SpellGainMagicEffect {
	"""
	周回数 1 つあたりの魔力（1 以上）
	"""
	perLap: Int!
}
"""
サイコロを複数振る効果（使った人は、そのターンのサイコロを count 個同時に振り、合計の分だけ進む）
"""
type SpellRollDiceEffect {
	"""
	振るサイコロの個数（2 以上）
	"""
	count: Int!
}
"""
スターターの配布の状態
"""
enum StarterGrantStatus {
	"""
	まだ届いていない（登録の直後で配布が始まっていない・配っている途中を含む）
	"""
	IN_PROGRESS
	"""
	所持カード・デッキ・解放がそろった
	"""
	COMPLETED
}
type Subscription {
	"""
	自分が参加している対戦の進み（登録済みのプレイヤーだけ）。つないだ直後に今の版を送り、版が進んだらすぐ、
	変わらなくても数秒ごとに送る（つながっていることの確認も兼ねる）。全員が戦利品を受け取り終えたら、その版を送ってから閉じる
	（対戦が終わっただけでは閉じない。受け取らないまま離れた人がいると閉じない）。
	無い・参加していない対戦は MatchNotFoundError を 1 回送って閉じる。SSE（graphql-sse）でつなぐ
	"""
	matchProgress(
		"""
		対戦の公開用の ID
		"""
		id: UUID!
	): MatchProgressResult!
}
"""
公開用の ID（UUID の文字列）。core の内部の ID は返さない
"""
scalar UUID
"""
サイコロを振る前にスペルを使う入力
"""
input UseMatchSpellInput {
	"""
	対戦の公開用の ID
	"""
	id: UUID!
	"""
	画面が見ていた対戦の revision
	"""
	revision: Int!
	"""
	使うスペルの手札の番号（0 始まり。Match.spellChoices の中から選ぶ。手札の範囲の外は ValidationErrors の FieldOutOfRange、範囲の中で使えないものは FieldNotFound）
	"""
	handIndex: Int!
	"""
	対象のプレイヤー（Match.participants の何番目か。spellChoices の targets の中から選ぶ。呪いのスペルで無ければ FieldRequired、対象を選ばないスペルに付けた・選べない対象は FieldNotFound）
	"""
	target: Int
	"""
	対象のクリーチャーがいる領地の位置（spellChoices の targetPositions の中から選ぶ。クリーチャーを選ぶスペルで無ければ FieldRequired、それ以外のスペルに付けた・選べない位置は FieldNotFound）
	"""
	targetPosition: BoardPositionInput
}
"""
useMatchSpell の結果（ROLLING の段階の、今の番の参加者だけ。番でなければ MatchNotYourTurnError、段階が違えば MatchPhaseNotAllowedError。参加していない対戦は MatchNotFoundError）
"""
union UseMatchSpellResult = UseMatchSpellSuccess | ValidationErrors | MatchNotFoundError | MatchNotYourTurnError | MatchPhaseNotAllowedError | RevisionConflictError | PlayerNotRegisteredError
"""
スペルを使った（コストを払い、効果を当て、スペルは捨て札に入る。続けてサイコロを振る。成功したら対戦の revision が進む）
"""
type UseMatchSpellSuccess {
	"""
	対戦の公開用の ID
	"""
	id: UUID!
	"""
	操作した後の対戦の revision
	"""
	revision: Int!
}
"""
入力の誤り（操作は行われていない）
"""
type ValidationErrors {
	"""
	項目ごとの誤り（1 件以上）
	"""
	errors: [FieldError!]!
}
"""
転送円（ぴったり止まると、対の相手の転送円へ移る。通り過ぎるだけなら移らない）。属性は持たない
"""
type WarpTile implements BoardTile {
	"""
	列
	"""
	x: Int!
	"""
	行
	"""
	y: Int!
}
