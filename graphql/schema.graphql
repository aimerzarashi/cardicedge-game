"""
対戦の後の意思表示をした。終えるなら部屋は休止中になり、全員が続けるなら準備中に戻る（準備完了と、公開前に決めた印が外れ、
ボード・対戦ルール・席の選びを今の担当の決まりで変え直せる）。ほかの人がまだなら、次を決める状態のまま
"""
type DeclareRoomNextSuccess {
	"""
	部屋の公開用の ID
	"""
	id: UUID!
	"""
	意思表示をした部屋の revision
	"""
