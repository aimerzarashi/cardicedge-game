# 開発環境の入口。ブラウザ・Playwright・cloudflared はここを経由して game / core に届く
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # core の GraphQL（Subscription の websocket を含む）。core が起動していなければ 503 になる
                        - match: { prefix: "/game/graphql" }
                          route:
                            cluster: core
                            upgrade_configs:
                              - upgrade_type: websocket
                        - match: { prefix: "/" }
                          route:
                            cluster: game
                            # Next.js の HMR（websocket）を通す
                            upgrade_configs:
                              - upgrade_type: websocket
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: game
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: game
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: game, port_value: 3000 }
    - name: core
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: core
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: core, port_value: 3333 }
