# 開発環境・テスト用の環境の入口。ブラウザ・Playwright・cloudflared はここを経由して game / core に届く。
# game には必ずここを経由して届くようにする（game は x-client-ip を信じるため、直接届くと IP を偽装できる）
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                # 利用者の IP は接続元から判定し、利用者が送った X-Forwarded-For は信じない（偽装させない。studio#10）。
                # 判定した IP を x-client-ip に上書きで入れ、better-auth はこれだけを見る（レート制限・セッションの記録）
                use_remote_address: true
                xff_num_trusted_hops: 0
                route_config:
                  name: local_route
                  request_headers_to_add:
                    - header: { key: x-client-ip, value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" }
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # core の GraphQL（Subscription の websocket を含む）。core が起動していなければ 503 になる。
                        # timeout: 0s は応答全体の長さの上限（既定 15 秒）を外す。Subscription（SSE）が 15 秒で切れるため。
                        # 何も流れない時間の上限（stream_idle_timeout の既定 5 分）は、core が 5 秒ごとに送るので変えない
                        - match: { prefix: "/game/graphql" }
                          route:
                            cluster: core
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: websocket
                        - match: { prefix: "/" }
                          route:
                            cluster: game
                            # Next.js の HMR（websocket）を通す
                            upgrade_configs:
                              - upgrade_type: websocket
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: game
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # 何もしていない接続は、Next.js（Node.js）が閉じるより先に envoy が手放す。Node.js は既定で 5 秒で閉じ、envoy は既定で
      # 1 時間使い回すため、閉じられた接続に送ると 503（reset reason: connection termination）になる（game#46。studio#68 と同じ）。
      # Next.js の側を延ばす案（公式の文書の形）は、開発の next dev に keep-alive を変える入口が無いため採らなかった
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options:
            idle_timeout: 4s
          explicit_http_config:
            http_protocol_options: {}
      load_assignment:
        cluster_name: game
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: game, port_value: 3000 }
    - name: core
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: core
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: core, port_value: 3333 }
